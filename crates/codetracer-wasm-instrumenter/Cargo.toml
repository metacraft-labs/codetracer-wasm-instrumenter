[package]
name        = "codetracer-wasm-instrumenter"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
description = "Bytecode-rewriting WASM instrumentation pipeline for CodeTracer (M27)."

[dependencies]
walrus      = { workspace = true }
# Reading `.debug_line` so recorded WASM frames carry real source
# locations. Already in the graph as a walrus dependency, so this adds
# no new third-party code — only a direct edge to it.
gimli       = "0.32"
wasmparser  = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = { workspace = true }

[dev-dependencies]
wat         = { workspace = true }
wasmprinter = { workspace = true }
# A real engine, so the M35 boundary-value tests assert on values that
# actually crossed the boundary rather than on instructions that would
# have carried them.
wasmi       = { workspace = true }
codetracer-wasm-stub-host = { path = "../codetracer-wasm-stub-host" }
